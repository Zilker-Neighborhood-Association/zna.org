name: Deploy to Live

on:
  push:
    branches:
      - 'main'

env:
  php_version: '8.4'
  dist_dir: 'to_deploy_agf1234w'

jobs:
  deploy:
    name: Deploy to Live
    runs-on: ubuntu-24.04
    env:
      DRUSH: ${{ secrets.LIVE_PATH }}/vendor/bin/drush
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: ${{ env.php_version }}

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Avoid GitHub rate limit for Composer
        run: composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Composer install
        run: composer install --prefer-dist --no-dev --no-interaction --no-progress --no-scripts --optimize-autoloader

      - name: Set up NPM
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: |
          cd web/themes/custom/zna_theme
          npm ci

      - name: Build theme
        run: |
          cd web/themes/custom/zna_theme
          npm run build

      - name: Place SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.LIVE_SSH_KEY }}
          known_hosts: ${{ vars.KNOWN_HOSTS }}

      - name: Configure SSH
        env:
          SSH_USER: ${{ secrets.LIVE_SSH_USER }}
          SSH_HOST: ${{ secrets.LIVE_SSH_HOST }}
        run: |
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_rsa
          END

      - name: Prepare code for deployment
        run: |
          mkdir -p ${{ env.dist_dir }}
          rsync -ar --exclude '${{ env.dist_dir }}' --exclude '.ddev' --exclude '.git' --exclude '.github' --exclude '.idea' --exclude 'files-private/' --exclude 'node_modules' --exclude 'web/files/' --exclude 'web/assets/' . ${{ env.dist_dir }}

      - name: Push code to Live
        env:
          remote_dir: ${{ secrets.LIVE_PATH }}
        run: |
          rsync -azri --progress --delay-updates --delete-after --exclude 'files-private/' --exclude 'web/files/' --exclude 'web/assets/' -e "ssh -o StrictHostKeyChecking=no" ${{ env.dist_dir }}/ staging:${remote_dir}

      - name: drush deploy
        run: ssh staging '${{ env.DRUSH }} deploy'
