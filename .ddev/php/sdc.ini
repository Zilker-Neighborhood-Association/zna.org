; Match production: strip PHP assertions.
;
; Drupal core's ComponentsTwigExtension::validateProps() validates SDC props
; via assert(), so it only fires when zend.assertions=1 (dev). civictheme
; 1.12 ships several SDC schemas that don't match runtime usage (e.g. grid
; items declared as string-only but render arrays are passed; vertical_spacing
; declared as enum without "none" but the editor field still allows "none").
; Production has assertions stripped, so these never fail there. Match that
; locally so dev behaves like prod. Re-enable (zend.assertions = 1) when
; you're explicitly debugging SDC schemas.
zend.assertions = -1
