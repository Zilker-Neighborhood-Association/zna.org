id: 2026_membership_dues
title: '2026 Membership Dues'
description: ''
categories: {  }
elements: |-
  start:
    '#type': webform_wizard_page
    '#title': Start
    intro:
      '#type': processed_text
      '#text': '<p>Thank you for supporting ZNA!</p><p>Membership expires on December 31, 2026 regardless of when you pay.</p><p>2026 dues payments began being accepted online on January 25, 2026. If you''re not sure whether you already paid, email our Treasurer via <a href="/node/11" data-entity-type="node" data-entity-uuid="4f683bf4-f796-4c2d-a223-315f36cc41db" data-entity-substitution="canonical">Contact ZNA</a>.</p>'
      '#format': civictheme_rich_text
    street_name:
      '#type': webform_entity_select
      '#title': 'Street name'
      '#empty_option': '- Select street -'
      '#sort_options': true
      '#required': true
      '#target_type': taxonomy_term
      '#selection_handler': 'default:taxonomy_term'
      '#selection_settings':
        target_bundles:
          zilker_street_names: zilker_street_names
        sort:
          field: name
          direction: asc
    street_name_info:
      '#type': processed_text
      '#text': '<p>The Zilker street on which you live.</p><p>Note that not all addresses on the listed streets are within <a href="/membership#boundaries">ZNA''s boundaries</a>. Examples of non-Zilker addresses:</p><ul><li data-list-item-id="e44dde4c2205a6e4698fc94d9cca0a339">S. Lamar south of Barton Skyway</li><li data-list-item-id="e1538a750c59dde331f3b6734caa9802d">Anything east of the train tracks</li><li data-list-item-id="ebff61dd6eb440a4997125e03edead344">Anything west of Rabb or Rae Dell</li></ul><p>Don''t see your street? Please check whether your street starts with W for West or S for South, check whether you live within <a href="/membership#boundaries">ZNA''s boundaries</a>, and <a href="/contact">contact</a> our Treasurer if still not sure.</p>'
      '#format': civictheme_rich_text
    street_number:
      '#type': textfield
      '#title': 'Street number'
      '#description': '<p>e.g. 2109</p>'
      '#maxlength': 6
      '#size': 6
      '#required': true
      '#label_attributes':
        class:
          - ct-label--required
    unit:
      '#type': textfield
      '#title': 'Apt / Unit #'
      '#description': '<p>If you have a unit or apartment number, please include it plain e.g. "3B" (not "Apt 3B").</p>'
      '#maxlength': 6
      '#size': 6
    number_of_members:
      '#type': radios
      '#title': 'Number of members'
      '#description': '<p>How many residents at this address do you wish to pay dues for?</p>'
      '#options':
        1: '1 adult'
        2: '2 adults'
      '#required': true
    membership_option:
      '#type': radios
      '#title': 'Membership option'
      '#options':
        member: 'Member ($12)'
        supporter: 'Supporter ($25)'
        advocate: 'Advocate ($50)'
        champion: 'Champion ($100)'
        hero: 'Hero ($500)'
        waiver: 'Request dues waiver'
      '#required': true
    membership_option_info:
      '#type': processed_text
      '#text': "<p>Dues pricing is per person. Membership options priced in excess of $12 include a donation to ZNA's general fund. Membership benefits are the same for all membership options; we're simply providing an easy way to further support ZNA without doing math!</p>"
      '#format': civictheme_rich_text
  member_info:
    '#type': webform_wizard_page
    '#title': 'Member info'
    member_info_intro_one_member:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="number_of_members"]':
            value: '1'
      '#text': '<p>Please enter information for the member.</p>'
      '#format': civictheme_rich_text
    member_info_intro_first_of_two_intro:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="number_of_members"]':
            value: '2'
      '#text': '<p>Please enter information for the first member.</p>'
      '#format': civictheme_rich_text
    name:
      '#type': webform_name
      '#title': Name
      '#title_display': none
      '#prepopulate': true
      '#title__access': false
      '#first__title': 'First name'
      '#first__required': true
      '#middle__access': false
      '#last__title': 'Last name'
      '#last__required': true
      '#degree__access': false
      '#flexbox': '1'
      '#select2': true
    email_address:
      '#type': webform_email_confirm
      '#title': 'Email address'
      '#autocomplete': email
      '#required': true
    phone:
      '#type': tel
      '#title': 'Phone number'
      '#autocomplete': 'off'
    list_publicly:
      '#type': radios
      '#title': 'List publicly'
      '#description': '<p>List my name on public lists of ZNA members.</p>'
      '#options': yes_no
      '#required': true
    get_involved:
      '#type': radios
      '#title': 'Get involved'
      '#description': '<p>Please contact me about opportunities to volunteer for ZNA committees and initiatives.</p>'
      '#options': yes_no
      '#required': true
  member_2_info:
    '#type': webform_wizard_page
    '#title': 'Member 2 info'
    '#states':
      visible:
        ':input[name="number_of_members"]':
          value: '2'
    member_info_intro_second_of_two_intro:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="number_of_members"]':
            value: '2'
      '#text': '<p>Please enter information for the second member.</p>'
      '#format': civictheme_rich_text
    name2:
      '#type': webform_name
      '#title': Name
      '#title_display': none
      '#prepopulate': true
      '#title__access': false
      '#first__title': 'First name'
      '#first__required': true
      '#middle__access': false
      '#last__title': 'Last name'
      '#last__required': true
      '#degree__access': false
      '#flexbox': '1'
      '#select2': true
    email_address2:
      '#type': webform_email_confirm
      '#title': 'Email address'
      '#autocomplete': email
      '#required': true
    phone_number2:
      '#type': tel
      '#title': 'Phone number'
      '#autocomplete': 'off'
    list_publicly2:
      '#type': radios
      '#title': 'List publicly'
      '#description': '<p>List my name on public lists of ZNA members.</p>'
      '#options': yes_no
      '#required': true
    get_involved2:
      '#type': radios
      '#title': 'Get involved'
      '#description': '<p>Please contact me about opportunities to volunteer for ZNA committees and initiatives.</p>'
      '#options': yes_no
      '#required': true
  payment:
    '#type': webform_wizard_page
    '#title': Payment
    '#states':
      visible:
        ':input[name="membership_option"]':
          '!value': waiver
