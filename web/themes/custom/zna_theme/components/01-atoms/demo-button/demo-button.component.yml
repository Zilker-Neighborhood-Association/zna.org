$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Demo Button
status: stable
description: Demonstration of adding a new atom-level component, isolated from CivicTheme's Button.
props:
  type: object
  properties:
    theme:
      type: string
      title: Theme
      description: 'Theme variation (light or dark).'
      enum:
        - light
        - dark
      default: light
    text:
      type: string
      title: Text
      description: 'Button text.'
    disabled:
      type: boolean
      title: Disabled
      description: 'Disabled state.'
    modifier_class:
      type: string
      title: Modifier classes
      description: 'Additional CSS classes.'
libraryOverrides:
  js:
    demo-button.js: {}
